[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guided-action-flow"
version = "0.1.0"
description = "Q-guided flow sampling for VLA action chunks."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "einops>=0.7",
  "huggingface_hub>=0.24",
  "hydra-core>=1.3",
  "numpy>=1.24",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
  "rich>=13.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
torch = [
  "torch>=2.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
