[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_armstrong_ros2"
version = "0.1.0"
description = "LeRobot observation/action adapter for the Armstrong ROS 2 right arm"
requires-python = ">=3.10"
dependencies = ["lerobot>=0.4.4", "numpy>=1.24,<2.0"]

[tool.setuptools.packages.find]
where = ["src"]
